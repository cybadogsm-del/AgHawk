[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E", "I", "B", "UP"]
"tests/**/*.py" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests"]
